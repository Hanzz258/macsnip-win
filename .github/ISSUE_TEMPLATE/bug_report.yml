name: Bug Report
description: Report a bug or unexpected behavior in macsnip-win
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run MacSnip.exe
        2. Press Ctrl+Shift+4
        3. Observe...
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows Version
      description: Run `winver` or `[System.Environment]::OSVersion.VersionString`
      placeholder: e.g. Windows 11 24H2 (Build 26100)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: macsnip-win Version
      placeholder: e.g. 1.3.0 / commit hash
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Error Log / Win32 Error Code
      description: Paste any relevant lines from `error.log` (next to MacSnip.exe or in `%LOCALAPPDATA%\MacSnip\error.log`).
      render: text
    validations:
      required: false
